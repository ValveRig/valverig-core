# Every pull request runs the gates. A merge to main runs them again and
# publishes, so a version on crates.io is one that passed review and CI.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Documentation
        run: cargo doc --no-deps
      # Both profiles: SIMD and float behaviour differ between them, and the
      # numeric tests have to hold in the build that ships.
      - name: Tests, debug
        run: cargo test
      - name: Tests, release
        run: cargo test --release
      - name: Build
        run: cargo build --release

  # The crate is built against its published dependencies rather than the
  # checkouts beside it, which is how anyone else will consume it.
  publish:
    needs: gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Already on crates.io?
        id: check
        run: |
          name=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].name')
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if cargo info "$name@$version" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$name $version is already published; nothing to do."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.check.outputs.publish == 'true'
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
