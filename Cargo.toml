[package]
name = "valverig-core"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
description = "The ValveRig engine: a rack of modules, the controls on it, presets in and out, and an allocation-free process() that runs anywhere"
license = "MIT"
repository = "https://github.com/ValveRig/valverig-core"

[dependencies]
valverig-nam = "0.0.1"
blake3 = { version = "1.8.7", default-features = false }
realfft = "3.5.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
toml = "1.1.4"
